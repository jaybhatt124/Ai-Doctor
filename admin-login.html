<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login — AI Doctor Analysis</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body style="background:linear-gradient(135deg,#0d2d52,#063560,#0a4d8c);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">

<div class="admin-login-card">
  <div class="alc-hdr">
    <div class="alc-ico">🔐</div>
    <h2>Admin Access</h2>
    <p>Authorised personnel only</p>
  </div>
  <div class="alc-body">
    <div id="login-err" class="err-msg" style="display:none"></div>
    <form onsubmit="doLogin(event)">
      <div class="fg">
        <label>Email Address</label>
        <input type="email" id="l-email" placeholder="admin@gmail.com" value="admin@gmail.com" required>
      </div>
      <div class="fg">
        <label>Password</label>
        <div class="pw-field">
          <input type="password" id="l-pass" placeholder="••••••••" value="admin123" required>
          <button type="button" class="eye-btn" onclick="togglePw(this)">👁</button>
        </div>
      </div>
      <button type="submit" class="btn btn-pr btn-full" style="margin-bottom:10px">
        Sign In to Dashboard
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      </button>
      <a href="index.html" class="btn btn-gh btn-full" style="margin-top:4px;text-align:center">← Return to Website</a>
    </form>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="js/data.js"></script>
<script>
// Already logged in? Redirect
if (isAdminLoggedIn()) window.location.href = 'admin.html';

function doLogin(e) {
  e.preventDefault();
  const email = document.getElementById('l-email').value.trim();
  const pass  = document.getElementById('l-pass').value;
  const err   = document.getElementById('login-err');

  if (adminLogin(email, pass)) {
    showToast('Login successful! Redirecting...', 'success');
    setTimeout(() => { window.location.href = 'admin.html'; }, 700);
  } else {
    err.textContent = 'Invalid email or password. Please try again.';
    err.style.display = 'block';
  }
}

function togglePw(btn) {
  const inp = btn.previousElementSibling;
  inp.type = inp.type === 'password' ? 'text' : 'password';
  btn.textContent = inp.type === 'password' ? '👁' : '🙈';
}
</script>
</body>
</html>
