<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Health Tips - AI Doctor Analysis</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="nav-overlay" id="navOverlay"></div>

  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="navbar-brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">AI Doctor Analysis</span>
          <span class="brand-tagline">Smart Health Education</span>
        </div>
      </a>
      <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="navbar-links" id="navLinks">
        <li><a href="index.html">🏠 Home</a></li>
        <li><a href="about.html">ℹ️ About</a></li>
        <li><a href="illness.html">🩺 Illness Info</a></li>
        <li><a href="tips.html">💡 Health Tips</a></li>
        <li><a href="contact.html">📬 Contact</a></li>
      </ul>
    </div>
  </nav>

  <main class="page-content">

    <div class="page-header">
      <h1>💡 Health Tips</h1>
      <p>Science-backed daily habits to improve your physical and mental wellbeing.</p>
    </div>

    <section class="section">
      <div class="container">

        <!-- Category Filter -->
        <div class="filter-bar" id="tipFilterBar">
          <button class="filter-btn active" onclick="setTipFilter('all', this)">All</button>
          <button class="filter-btn" onclick="setTipFilter('nutrition', this)">🥗 Nutrition</button>
          <button class="filter-btn" onclick="setTipFilter('fitness', this)">🏃 Fitness</button>
          <button class="filter-btn" onclick="setTipFilter('sleep', this)">😴 Sleep</button>
          <button class="filter-btn" onclick="setTipFilter('hydration', this)">💧 Hydration</button>
          <button class="filter-btn" onclick="setTipFilter('mental', this)">🧘 Mental</button>
          <button class="filter-btn" onclick="setTipFilter('hygiene', this)">🧼 Hygiene</button>
          <button class="filter-btn" onclick="setTipFilter('health', this)">🏥 General</button>
        </div>

        <div id="tipsContainer" style="display:flex;flex-direction:column;gap:16px;"></div>

      </div>
    </section>

    <!-- Daily Reminder Banner -->
    <section style="background:linear-gradient(135deg,var(--primary-dark),var(--primary));padding:40px 24px;text-align:center;color:white;">
      <div class="container">
        <h2 style="font-size:clamp(1.3rem,3vw,1.8rem);margin-bottom:10px;">🌟 Today's Health Reminder</h2>
        <p id="dailyTip" style="font-size:clamp(0.9rem,2.5vw,1.05rem);opacity:0.9;max-width:600px;margin:0 auto 20px;"></p>
        <button onclick="newDailyTip()" style="background:white;color:var(--primary);border:none;padding:11px 24px;border-radius:10px;font-family:Poppins,sans-serif;font-weight:600;font-size:0.9rem;cursor:pointer;transition:transform 0.2s;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform=''">
          🔄 New Tip
        </button>
      </div>
    </section>

  </main>

  <footer>
    <p>&copy; 2025 AI Doctor Analysis &mdash; <a href="about.html">About</a> &bull; <a href="contact.html">Contact</a></p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    const categoryEmoji = {
      nutrition: '🥗', fitness: '🏃', sleep: '😴',
      hydration: '💧', mental: '🧘', hygiene: '🧼', health: '🏥'
    };

    let currentTipFilter = 'all';

    function renderTips() {
      const container = document.getElementById('tipsContainer');
      const list = healthData.healthTips.filter(t =>
        currentTipFilter === 'all' || t.category === currentTipFilter
      );

      container.innerHTML = list.map((tip, idx) => `
        <div class="tip-item">
          <div class="tip-number">${idx + 1}</div>
          <div>
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;">
              <h3 style="font-size:1rem;font-weight:600;color:var(--text-dark);">${tip.title}</h3>
              <span class="tag">${categoryEmoji[tip.category] || ''} ${tip.category}</span>
            </div>
            <p style="font-size:0.875rem;color:var(--text-mid);line-height:1.6;">${tip.text}</p>
          </div>
        </div>
      `).join('');

      if (list.length === 0) {
        container.innerHTML = '<p style="color:var(--text-light);">No tips found for this category.</p>';
      }
    }

    function setTipFilter(cat, btn) {
      currentTipFilter = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTips();
    }

    function newDailyTip() {
      const tip = healthData.healthTips[Math.floor(Math.random() * healthData.healthTips.length)];
      document.getElementById('dailyTip').textContent = `💬 "${tip.title}" — ${tip.text}`;
    }

    renderTips();
    newDailyTip();
  </script>
</body>
</html>
